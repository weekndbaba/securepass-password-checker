<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>SecurePass</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  <style>
    #tips { font-size: 0.9rem; }
  </style>
</head>
<body class="bg-light">
  <div class="container mt-5">
    <div class="row justify-content-center">
      <div class="col-md-6">
        <div class="card shadow p-4">
          <h2 class="text-center mb-4">🔒 SecurePass – Password Strength Checker</h2>
          <form method="POST">
            <div class="mb-3">
              <input type="password" class="form-control" name="password" id="passwordInput" placeholder="Enter password" required>
            </div>

            <div class="mb-3">
              <div class="progress">
                <div id="strengthBar" class="progress-bar" role="progressbar" style="width: 0%">0%</div>
              </div>
            </div>

            <div id="strengthText" class="text-center mb-3 fw-bold"></div>
            <div id="tips" class="text-muted"></div>

            <div class="d-grid">
              <button type="submit" class="btn btn-primary">Check Strength</button>
            </div>
          </form>
          <a href="{{ url_for('dashboard') }}" class="btn btn-outline-secondary mt-3 w-100">View Dashboard</a>

          {% if strength %}
            <div class="alert mt-4 
              {% if strength == 'Strong' %}
                alert-success
              {% elif strength == 'Medium' %}
                alert-warning
              {% else %}
                alert-danger
              {% endif %}
            ">
              Password Strength (from server): <strong>{{ strength }}</strong>
            </div>
          {% endif %}
        </div>
      </div>
    </div>
  </div>

  <script>
    const passwordInput = document.getElementById('passwordInput');
    const strengthBar = document.getElementById('strengthBar');
    const strengthText = document.getElementById('strengthText');
    const tips = document.getElementById('tips');

    passwordInput.addEventListener('input', () => {
      const password = passwordInput.value;
      let score = 0;
      let suggestions = [];

      if (password.length >= 8) score++; else suggestions.push("Use at least 8 characters");
      if (/[A-Z]/.test(password)) score++; else suggestions.push("Add an uppercase letter");
      if (/[a-z]/.test(password)) score++; else suggestions.push("Add a lowercase letter");
      if (/\d/.test(password)) score++; else suggestions.push("Add a number");
      if (/[!@#$%^&*(),.?\":{}|<>]/.test(password)) score++; else suggestions.push("Add a special symbol");

      const percentage = (score / 5) * 100;
      strengthBar.style.width = percentage + "%";
      strengthBar.textContent = percentage + "%";

      // Set color and text
      if (score <= 2) {
        strengthBar.className = "progress-bar bg-danger";
        strengthText.textContent = "Weak";
      } else if (score === 3 || score === 4) {
        strengthBar.className = "progress-bar bg-warning text-dark";
        strengthText.textContent = "Medium";
      } else {
        strengthBar.className = "progress-bar bg-success";
        strengthText.textContent = "Strong";
      }

      // Tips
      tips.innerHTML = "";
      if (score < 5) {
        tips.innerHTML = "<strong>Tips:</strong><ul>" + suggestions.map(t => `<li>${t}</li>`).join('') + "</ul>";
      }
    });
  </script>
</body>
</html>
